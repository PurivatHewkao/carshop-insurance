openapi: 3.1.0
info:
  title: Carshop Sales API
  version: 1.0.0
  description: >-
    Sales lookup, appointment, assignment, order, and approval endpoints.
    All routes except GET /api/v1/health require an active Identity session.
servers:
  - url: http://localhost:3003/api/v1
    description: Local development
security:
  - bearerAuth: []
  - identityCookie: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { const: sales }
                  status: { const: ok }
                required: [service, status]
  /lookups/cars:
    get:
      summary: List bookable cars for sales forms
      responses:
        '200':
          description: Cars available to the current customer or sales user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        modelId: { $ref: '#/components/schemas/Uuid' }
                        brand: { type: string }
                        modelName: { type: string }
                        modelLabel: { type: string }
                        color: { type: string }
                        manufactureYear: { type: integer }
                        label: { type: string }
                        vin: { type: [string, 'null'] }
                        price: { type: number }
                        status: { type: string }
                      required: [id, label, price, status]
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lookups/customers:
    get:
      summary: List active customers for sales staff
      description: Requires seller, manager, or admin. Customer role is denied.
      responses:
        '200': { $ref: '#/components/responses/DataArray' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lookups/customers/{id}:
    get:
      summary: Get customer contact details for an authorized sales relationship
      description: >-
        Seller access is limited to customers with an appointment assigned to
        that seller or an order created by that seller. Manager and admin may
        view any active customer.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lookups/sellers:
    get:
      summary: List active sellers and their active appointment counts
      description: Requires seller, manager, or admin.
      responses:
        '200': { $ref: '#/components/responses/DataArray' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lookups/insurances:
    get:
      summary: List active insurance plans
      responses:
        '200': { $ref: '#/components/responses/DataArray' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lookups/actor:
    get:
      summary: Resolve the authenticated user's Sales record IDs
      description: User ID comes from Identity; request input cannot select another actor.
      responses:
        '200':
          description: Authenticated actor mapping
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId: { $ref: '#/components/schemas/Uuid' }
                      role:
                        {
                          type: string,
                          enum: [customer, seller, manager, admin],
                        }
                      customerId:
                        {
                          oneOf:
                            [
                              { $ref: '#/components/schemas/Uuid' },
                              { type: 'null' },
                            ],
                        }
                      employeeId:
                        {
                          oneOf:
                            [
                              { $ref: '#/components/schemas/Uuid' },
                              { type: 'null' },
                            ],
                        }
                    required: [userId, role, customerId, employeeId]
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments:
    get:
      summary: List appointments visible to the authenticated role
      description: >-
        Customers and sellers are always scoped to their own records. Manager and
        admin may filter by customerId or sellerId. Optional status is a database
        status (PENDING, CONFIRMED, COMPLETED, CANCELLED).
      parameters:
        - in: query
          name: customerId
          schema: { $ref: '#/components/schemas/Uuid' }
        - in: query
          name: sellerId
          schema: { $ref: '#/components/schemas/Uuid' }
        - in: query
          name: status
          schema:
            { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] }
      responses:
        '200': { $ref: '#/components/responses/DataArray' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create an appointment request
      description: Customer only. customerId in the body is ignored; identity is taken from the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  {
                    $ref: '#/components/schemas/Uuid',
                    description: Ignored; derived from session,
                  }
                carId: { $ref: '#/components/schemas/Uuid' }
                appointmentType: { type: string, enum: [VIEW_CAR, TEST_DRIVE] }
                appointmentDate:
                  {
                    type: string,
                    format: date,
                    description: Today or later in Asia/Bangkok,
                  }
                appointmentTime:
                  { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
                note: { type: string, maxLength: 2000 }
              required:
                [carId, appointmentType, appointmentDate, appointmentTime]
      responses:
        '201': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments/availability:
    get:
      summary: Get booked appointment times for a date
      description: Customer only. A time is unavailable when another active appointment is within one hour.
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Booked time slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bookedTimes:
                        {
                          type: array,
                          items: { type: string, pattern: '^\d{2}:\d{2}$' },
                        }
                    required: [bookedTimes]
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments/{id}/assign:
    patch:
      summary: Assign a seller to a pending appointment
      description: Manager or admin only. assignedBy is derived from the authenticated employee record.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sellerId: { $ref: '#/components/schemas/Uuid' }
                assignedBy:
                  {
                    $ref: '#/components/schemas/Uuid',
                    description: Ignored; derived from session,
                  }
                note: { type: string, maxLength: 2000 }
              required: [sellerId]
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments/{id}/status:
    patch:
      summary: Advance or cancel an appointment
      description: Customers may cancel their own pending request. Sellers may update assigned appointments only.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  { type: string, enum: [CONFIRMED, COMPLETED, CANCELLED] }
              required: [status]
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments/{id}:
    delete:
      summary: Delete an appointment
      description: Admin only.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Appointment deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    get:
      summary: List orders visible to the authenticated role
      description: Customers and sellers are scoped to their own records; managers and admins may filter the list.
      parameters:
        - in: query
          name: customerId
          schema: { $ref: '#/components/schemas/Uuid' }
        - in: query
          name: sellerId
          schema: { $ref: '#/components/schemas/Uuid' }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED] }
      responses:
        '200': { $ref: '#/components/responses/DataArray' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create an order for manager approval
      description: Seller only. sellerId is derived from session; prices and insurance premium are read inside the database transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: { $ref: '#/components/schemas/Uuid' }
                sellerId:
                  {
                    $ref: '#/components/schemas/Uuid',
                    description: Ignored; derived from session,
                  }
                carId: { $ref: '#/components/schemas/Uuid' }
                insuranceId:
                  {
                    oneOf:
                      [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }],
                  }
                discount:
                  { type: [string, number], pattern: '^\d+(?:\.\d{1,2})?$' }
                note: { type: string, maxLength: 2000 }
              required: [customerId, carId]
      responses:
        '201': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/decision:
    patch:
      summary: Approve or reject a pending order
      description: Manager or admin only.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                comment: { type: string, maxLength: 1000 }
              required: [decision]
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    identityCookie:
      type: apiKey
      in: cookie
      name: carshop_identity_session
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
  schemas:
    Uuid:
      type: string
      format: uuid
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
  responses:
    DataArray:
      description: Successful result list
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { type: object } }
            required: [data]
    DataObject:
      description: Successful result
      content:
        application/json:
          schema:
            type: object
            properties: { data: { type: object } }
            required: [data]
    BadRequest:
      description: Invalid request or business validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid Identity session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role or ownership check failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Requested record does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Appointment slot, transition, or stock conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
